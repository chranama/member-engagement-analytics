[project]
name = "member-engagement-analytics"
version = "0.1.0"
description = "Transaction engagement analysis using the COFINFAD dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<1.5",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<0.14",
]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
default-groups = ["analysis", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "full_data: opt-in tests that build from the complete local COFINFAD files",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
